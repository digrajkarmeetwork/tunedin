name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate config files
        run: node -e 'for (const f of ["vercel.json","manifest.webmanifest"]) JSON.parse(require("fs").readFileSync(f,"utf8"))'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Smoke test
        run: node tests/smoke.mjs
