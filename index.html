*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;height:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--bg);color:var(--ink);font-family:var(--font);

button{cursor:pointer;border:0;background:none}

.chip .pips{position:absolute;right:8px;bottom:8px;display:flex;gap:2px}
.chip .pips i{width:4px;height:10px;border-radius:2px;background:var(--line)}
.chip .pips i.f{background:var(--c)}

/* ---------- layout ---------- */
.main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0;overflow-y:auto;padding:6px 0}
.foot{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.btn{height:60px;border-radius:20px;font-weight:800;font-size:19px;letter-spacing:.2px;

svg.dial.noanim .shutter{transition:none}
svg.dial .needle{filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
svg.dial.drag{cursor:grab}
.home-dial .needle{animation:sweep 5s ease-in-out infinite;transform-box:view-box;transform-origin:200px 205px}
@keyframes sweep{0%,100%{transform:rotate(-55deg)}45%{transform:rotate(38deg)}60%{transform:rotate(30deg)}}

.end.r{background:color-mix(in srgb,var(--pink) 22%,transparent);color:var(--ink);text-align:right}
.end small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}

.panel{background:var(--surface);border-radius:var(--radius);padding:14px 16px}

.logo .w{display:inline-block;background:linear-gradient(90deg,var(--teamB),var(--violet) 45%,var(--pink) 75%,var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{text-align:center;color:var(--muted);font-size:17px;margin:10px 0 0}

/* ---------- setup ---------- */
.sect{display:flex;flex-direction:column;gap:8px}
.sect>label{font-weight:700;font-size:15px;color:var(--muted)}
.seg{display:flex;background:var(--surface);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;height:44px;border-radius:12px;font-weight:700;font-size:15px;color:var(--muted)}

.packs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pack{position:relative;text-align:left;border-radius:16px;padding:12px;background:var(--surface);border:2px solid transparent;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .1s}

.pack.make{border:2px dashed var(--line);background:transparent}
.teamin{display:flex;gap:8px;align-items:center}
.teamin i{width:14px;height:14px;border-radius:50%;flex:none}

.handoff{border-radius:var(--radius-lg);padding:26px 22px;background:var(--c);color:#1E1646;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 10px 0 color-mix(in srgb,var(--c) 50%,#000)}
.handoff .big{font-size:40px}
.handoff p{margin:0;font-size:18px;font-weight:600;line-height:1.35}
.eye{font-size:56px;line-height:1}

/* ---------- guess ---------- */
.timer{display:flex;align-items:center;gap:10px}
.timer .track{flex:1;height:10px;border-radius:10px;background:var(--surface);overflow:hidden}
.timer .fill{height:100%;background:var(--mint);border-radius:10px;transition:width 1s linear, background .3s}
.timer .t{font-weight:800;font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.nudge{display:flex;justify-content:center;gap:12px}
.nudge button{width:56px;height:44px;border-radius:14px;background:var(--surface);font-size:18px;font-weight:800}

/* ---------- left/right ---------- */
.lr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lr button{height:120px;border-radius:22px;font-weight:800;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#1E1646}
.lr button span{font-size:13px;font-weight:700;opacity:.75;max-width:90%}
.lr .L{background:var(--teamB)} .lr .R{background:var(--pink);color:#fff}

/* ---------- reveal ---------- */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.pts{font-size:88px;font-weight:800;line-height:.9;font-variation-settings:"wdth" 75;opacity:0;transform:scale(.3)}
.pts.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}
.verdict{font-size:22px;font-weight:800}
.lrres{font-size:15px;color:var(--muted);font-weight:600}
.fade{opacity:0;transition:opacity .4s .9s}
.fade.show{opacity:1}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,6,30,.6);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.sheet{background:var(--bg2);width:100%;max-width:480px;max-height:88%;overflow:auto;border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-size:28px;font-weight:800;font-variation-settings:"wdth" 80}
.sheet ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;line-height:1.4}

.wedgekey span{flex:1;text-align:center;padding:8px 0;border-radius:10px;font-weight:800;color:#1E1646}
.list{display:flex;flex-direction:column;gap:6px}

.list .it span{flex:1}
.err{color:var(--pink);font-weight:700;font-size:14px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-3px}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- confetti ---------- */
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:30;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;padding:12px 18px;border-radius:14px;z-index:40;animation:up .2s}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}

.pl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ================= Pure logic ================= */
function scoreFor(dial, target){
  const d = Math.abs(dial - target);
  if (d <= BAND/2) return 4; if (d <= BAND*1.5) return 3; if (d <= BAND*2.5) return 2; return 0;
}
function randTarget(){ return BAND*2.5 + Math.random()*(180 - BAND*5); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function allPacks(){ return PACKS.concat(S.custom); }
function buildDeck(ids){
  const cards=[];
  allPacks().forEach(p=>{ if(ids.includes(p.id)) p.cards.forEach(c=>cards.push([clean(c[0]).slice(0,40),clean(c[1]).slice(0,40),p.id,p.kind||"spectrum"])); });
  return shuffle(cards);
}
function drawTwist(mode){
  if (mode==="off") return null;
  if (mode==="some" && Math.random() > 0.4) return null;
  const t = Object.assign({}, TWISTS[Math.floor(Math.random()*TWISTS.length)]);
  if (t.id==="letter"){ const L = LETTERS[Math.floor(Math.random()*LETTERS.length)]; t.t = "Starts with “"+L+"”"; t.d = "Your clue must start with the letter "+L+"."; }
  return t;
}
function applyRound(g, r){
  const pts = scoreFor(r.dial, r.target);
  const mult = r.twist && r.twist.fx==="double" ? 2 : 1;
  const sm = {pts, gained: pts*mult, lrPoint:0, again:false, over:false, winner:null, bonusCard:false};
  if (g.mode==="coop"){
    g.coop.total += pts*mult; g.coop.left -= 1;
    if (pts===4){ g.coop.left += 1; sm.bonusCard = true; }
    if (g.coop.left <= 0) sm.over = true;
    g.round++; return sm;
  }
  const a = g.active, o = 1-a;
  g.teams[a].score += pts*mult;
  if (r.lr){
    const off = r.target - r.dial;
    const ok = (r.lr==="left" && off < -0.5) || (r.lr==="right" && off > 0.5);
    if (ok && pts!==4){ g.teams[o].score += 1; sm.lrPoint = 1; }
  }
  const sa = g.teams[a].score, so = g.teams[o].score;
  if ((sa >= g.goal || so >= g.goal) && sa !== so){ sm.over = true; sm.winner = sa > so ? a : o; }
  if (!sm.over){
    if (g.mode==="teams" && pts===4 && sa < so) sm.again = true;
    else g.active = o;
  }
  g.round++; return sm;
}

/* ================= Game construction ================= */
function makeGame(cfg){
  // cfg: {mode, names[2], packs, twists, timer, goal, players? (online)}
  const online = !!cfg.players;
  let teams;
  if (cfg.mode==="coop"){
    teams = [{name:"Together", color:COL_CO, score:0, members: online ? cfg.players.map(p=>p.id) : [], psy:0}];
  } else if (online && cfg.mode==="duel"){
    teams = cfg.players.slice(0,2).map((p,i)=>({name:p.name, color:i?COL_B:COL_A, score:i, members:[p.id], psy:0}));
  } else {
    teams = [0,1].map(i=>({name:(cfg.names[i]||"").trim()||(i?"Sky":"Coral"), color:i?COL_B:COL_A, score:i, psy:0,
      members: online ? cfg.players.filter(p=>p.team===i).map(p=>p.id) : []}));
  }
  const g = {mode:cfg.mode, online, players: online ? cfg.players.map(p=>({id:p.id,name:p.name})) : [],
    teams, goal:cfg.goal||10, round:1, active:0, twists:cfg.twists, timer:cfg.timer, packs:cfg.packs.slice(),
    coop:{left:7,total:0}, deck:buildDeck(cfg.packs), r:null, lastSummary:null, winner:null, phase:null};
  startRound(g);
  return g;
}
function drawCard(g){ if(!g.deck.length) g.deck = buildDeck(g.packs); return g.deck.pop(); }
function dealCard(g, r){
  r.card = drawCard(g); r.kind = r.card[3] || "spectrum";
  r.target = r.kind==="me" ? 90 : randTarget(); r.set = false;
  r.twist = r.kind==="me" ? null : drawTwist(g.twists);
  r.timeLimit = r.twist && r.twist.fx==="speed" ? 20 : g.timer;
}
function startRound(g){
  const a = g.mode==="coop" ? 0 : g.active, t = g.teams[a];
  let psychic=null, guessers=[], lrPlayers=[], noLR = g.mode!=="teams";
  if (g.online){
    const all = g.players.map(p=>p.id);
    const m = t.members.length ? t.members : all;
    psychic = m[t.psy % m.length]; t.psy++;
    if (g.mode==="coop") guessers = all.filter(x=>x!==psychic);
    else {
      guessers = t.members.filter(x=>x!==psychic);
      if (!guessers.length){ guessers = all.filter(x=>x!==psychic); noLR = true; }
      lrPlayers = noLR ? [] : g.teams[1-a].members.slice();
    }
  }
  const r = {dial:90, clue:"", swaps:1, lr:null, team:a, psychic, guessers, lrPlayers, noLR, timerEnd:null, done:false};
  dealCard(g, r);
  g.r = r;
  g.phase = g.online ? "clue" : "handoff";
}
function playerName(g, id){ const p = (g.players||[]).find(p=>p.id===id); return p ? p.name : "Someone"; }

/* ================= Reducer (runs on host or locally) ================= */
function reduce(a, p, from){
  const g = S.game; if(!g) return false;
  const r = g.r;
  const isPsy = !g.online || from===r.psychic;
  const isGuess = !g.online || r.guessers.includes(from);
  const isLR = !g.online || r.lrPlayers.includes(from);
  switch(a){
    case "toPsychic": if(g.phase!=="handoff") return false; g.phase="clue"; return true;
    case "swap": if(!isPsy||g.phase!=="clue"||r.swaps<=0) return false; r.swaps--; dealCard(g, r); return true;
    case "setTarget": if(!isPsy||g.phase!=="clue"||r.kind!=="me") return false; r.target=Math.max(0,Math.min(180,+p.v)); r.set=true; return true;
    case "hide":
      if(!isPsy||g.phase!=="clue") return false;
      if(r.kind==="me" && !r.set) return false;
      r.clue = clean(p.clue).slice(0,40); r.dial=90; g.phase="guess";
      r.timerEnd = r.timeLimit ? Date.now() + r.timeLimit*1000 : null;
      return true;
    case "dial": if(!isGuess||g.phase!=="guess") return false; r.dial=Math.max(0,Math.min(180,+p.v)); return true;
    case "lock":
      if(!(isGuess || p.auto) || g.phase!=="guess") return false;
      if(g.mode==="teams" && !r.noLR){ g.phase="lr"; return true; }
      finish(g); return true;
    case "lr": if(!isLR||g.phase!=="lr") return false; r.lr = p.v==="left"?"left":"right"; finish(g); return true;
    case "next":
      if(g.phase!=="reveal") return false;
      if(g.lastSummary && g.lastSummary.over){ g.phase="over"; return true; }
      startRound(g); return true;
    case "skip": // host menu: abandon round
      if(g.online && from!==S.lobby.hostId) return false;
      if(g.mode!=="coop") g.active = 1-g.active;
      startRound(g); return true;
  }
  return false;
}
function finish(g){
  g.lastSummary = applyRound(g, g.r); g.r.done = true;
  if (g.lastSummary.over && g.mode!=="coop") g.winner = g.lastSummary.winner;
  g.phase = "reveal";
}

/* dispatch: send to host if guest, else reduce + broadcast */
function dispatch(a, p={}, opts={}){
  if (!authority()){ netSend({t:"act", a, p}); return; }
  const changed = reduce(a, p, S.net ? CID : null);
  if (!changed) return;
  if (S.net){ if(a==="dial") broadcastDial(); else broadcast(); }
  saveGame();
  if (!opts.quiet) render(true);
}

function ac(){ if(S.prefs.muted) return null; try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){AC=null;} return AC; }
function tone(freq, dur=.08, type="sine", vol=.08, when=0){
  const c=ac(); if(!c) return;
  const o=c.createOscillator(), gn=c.createGain(); const t=c.currentTime+when;
  o.type=type; o.frequency.setValueAtTime(freq,t);
  gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(vol,t+.01); gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn).connect(c.destination); o.start(t); o.stop(t+dur+.02);
}

  join(){ tone(523,.1,"triangle",.08); tone(784,.14,"triangle",.08,.09); },
  whoosh(){ const c=ac(); if(!c) return; const o=c.createOscillator(),g=c.createGain(),t=c.currentTime; o.type="sawtooth";
    o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(900,t+.8); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.04,t+.2); g.gain.exponentialRampToValueAtTime(.0001,t+.9);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+1); },
  score(p){ const seq = {0:[220,185],2:[523,659],3:[523,659,784],4:[523,659,784,1047,1319]}[p]||[440];

function wedge(v1, v2, r){ v1=Math.max(0,v1); v2=Math.min(180,v2); if(v2<=v1) return ""; const [x1,y1]=pt(v1,r),[x2,y2]=pt(v2,r);
  return `M${CX},${CY} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 0 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`; }

function bandsSVG(t){
  if (t==null) return "";
  const W=BAND, rr=R-2; let out="";
  [[t-2.5*W,t-1.5*W,"var(--sun)",2],[t-1.5*W,t-.5*W,"var(--mint)",3],[t-.5*W,t+.5*W,"var(--pink)",4],[t+.5*W,t+1.5*W,"var(--mint)",3],[t+1.5*W,t+2.5*W,"var(--sun)",2]]
  .forEach(([a,b,col,n])=>{ const d=wedge(a,b,rr); if(!d) return; out+=`<path d="${d}" fill="${col}"/>`;
    const m=(Math.max(0,a)+Math.min(180,b))/2; if(Math.min(180,b)-Math.max(0,a) < 5) return;
    const [lx,ly]=pt(m, R*0.8); out+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="19" font-weight="800" fill="#1E1646" font-family="var(--font)">${n}</text>`; });
  return out;
}
function dialSVG({target=null, needle=90, open=false, noanim=false, interactive=false, home=false, hideNeedle=false}={}){
  let ticks="";
  for(let v=0; v<=180; v+=10){ const [x1,y1]=pt(v,R-4),[x2,y2]=pt(v, v%30===0?R-18:R-11);
    ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--muted)" stroke-opacity=".5" stroke-width="${v%30===0?3:2}" stroke-linecap="round"/>`; }
  const rings = [0.35,0.55,0.75].map(f=>`<path d="M${CX-R*f},${CY} A${R*f},${R*f} 0 0 1 ${CX+R*f},${CY}" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="2"/>`).join("");
  return `<svg class="dial ${open?"open":""} ${noanim?"noanim":""} ${interactive?"drag":""} ${home?"home-dial":""}" viewBox="0 0 400 225" role="img" aria-label="Dial">
    <defs><clipPath id="topHalf"><rect x="0" y="0" width="400" height="${CY}"/></clipPath>
      <linearGradient id="shut" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--shutterA)"/><stop offset="1" stop-color="var(--shutterB)"/></linearGradient></defs>
    <path d="M${CX-R-8},${CY} A${R+8},${R+8} 0 0 1 ${CX+R+8},${CY} Z" fill="var(--faceEdge)"/>
    <path d="M${CX-R},${CY} A${R},${R} 0 0 1 ${CX+R},${CY} Z" fill="var(--face)"/>
    <g class="bands">${bandsSVG(target)}</g>
    <g clip-path="url(#topHalf)"><g class="shutter"><path d="M${CX-R-1},${CY} A${R+1},${R+1} 0 0 1 ${CX+R+1},${CY} Z" fill="url(#shut)"/>${rings}</g></g>
    ${ticks}
    ${hideNeedle?"":`<g class="needle" ${home?"":`transform="rotate(${(needle-90).toFixed(2)} ${CX} ${CY})"`}>
      <line x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY-R+14}" stroke="#FF3B5C" stroke-width="7" stroke-linecap="round"/>
      <circle cx="${CX}" cy="${CY-R+14}" r="7" fill="#FF3B5C"/></g>`}

}

function topBar(){

  let mid="";
  if (g && g.mode!=="coop"){
    mid = `<div class="scores">${g.teams.map((t,i)=>`<div class="chip ${i===g.active?"on":""}" style="--c:${t.color}">
      <div class="nm">${esc(t.name)}${g.online && t.members.includes(CID)?'<span class="youtag">you</span>':""}</div><div class="sc">${t.score}</div>
      <div class="pips">${Array.from({length:g.goal},(_,k)=>`<i class="${k<t.score?"f":""}"></i>`).join("")}</div></div>`).join("")}</div>`;
  } else if (g){
    mid = `<div class="scores"><div class="chip" style="--c:var(--mint)"><div class="nm">Team score</div><div class="sc">${g.coop.total}</div></div>
      <div class="chip" style="--c:var(--sun)"><div class="nm">Cards left</div><div class="sc">${g.coop.left}</div></div></div>`;
  } else if (S.net && S.lobby){
    mid = `<div class="scores" style="justify-content:center"><span class="tag"><span class="netdot"></span>Room ${esc(S.lobby.code)}</span></div>`;
  } else mid = `<div style="flex:1"></div>`;
  const inRoom = g || S.net;
  return `<div class="bar">
    <button class="iconbtn" data-act="${inRoom?"menu":"help"}" aria-label="${inRoom?"Menu":"How to play"}">${inRoom?"☰":"?"}</button>
    ${mid}
    <button class="iconbtn" data-act="mute" aria-label="${S.prefs.muted?"Unmute":"Mute"}">${S.prefs.muted?"🔇":"🔊"}</button>
  </div>`;
}

/* ================= Shared bits ================= */
function packTiles(sel, act, editable=true){
  return allPacks().map(pk=>`<button class="pack ${sel.includes(pk.id)?"on":""}" style="--pc:${pk.c||"#8F6BFF"}" ${editable?`data-act="${act}" data-id="${esc(pk.id)}"`:"disabled"} aria-pressed="${sel.includes(pk.id)}">
    <span class="e">${pk.e||"✨"}</span><span><b>${esc(pk.name)}</b><br><small>${pk.kind==="me"?"About you · ":""}${pk.cards.length} cards</small></span></button>`).join("");
}
function seg(act, cur, opts, editable=true){
  return `<div class="seg">${opts.map(([v,l])=>`<button class="${cur===v?"on":""}" ${editable?`data-act="${act}" data-v="${v}"`:"disabled"}>${l}</button>`).join("")}</div>`;
}
const MODE_HINT = {
  teams:"Two teams take turns. First to 10 points wins.",
  duel:"Just the two of you. Take turns giving clues. You score when your partner reads you right. First to 10 wins.",
  coop:"Everyone plays as one team for 7 cards. Bullseyes earn a bonus card."
};
function coupleHint(mode, packs){
  if (mode!=="duel") return "";
  const has = packs.includes("knowme") || packs.includes("date");
  return `<p class="hint">💞 Playing as a couple? Add <b>Know Me</b>: you place yourself on the dial and your partner guesses where you are.${has?"":""}</p>`;
}

screens.lobby = () => {

  const count = buildDeck(st.packs).length;
  const need = st.mode==="teams" ? [0,1].every(t=>L.players.some(p=>p.team===t)) : n>=2;

  <div class="main form lobby" style="justify-content:flex-start;gap:16px">
    <div class="sect a-code" style="align-items:center"><label>Room code</label>

/* ---- in-game ---- */
screens.handoff = () => {
  const g=S.game, sm=g.lastSummary, again = sm && sm.again && !sm.over;
  const c = g.mode==="coop" ? "var(--mint)" : activeTeam().color;
  let title, body;
  if (g.mode==="duel"){ title = `${esc(activeTeam().name)}, you're the psychic`; body = `Take the phone. ${esc(otherTeam().name)}, no peeking!`; }
  else if (g.mode==="coop"){ title = "Next psychic"; body = "Pick a psychic and hand them the phone. Everyone else, look away."; }
  else { title = esc(activeTeam().name)+(again?", go again!":", you're up"); body = (again?"Bullseye while behind earns a bonus turn. ":"")+"Pick a psychic and hand them the phone. Everyone else, look away."; }
  return `${topBar()}
  <div class="main">
    <div class="handoff" style="--c:${c}"><div class="eye">🔮</div><h2 class="big">${title}</h2><p>${body}</p></div>
    <p class="hint" style="text-align:center">Round ${g.round}${g.mode==="coop"?"":" · first to "+g.goal}</p>
  </div>
  <div class="foot"><button class="btn" data-act="toPsychic">I'm the psychic. Show me.</button></div>`;
};

function waitHTML(msg){ return `<div class="wait"><div class="dots"><i></i><i></i><i></i></div><p class="hint">${msg}</p></div>`; }

screens.clue = () => {
  const g=S.game, r=g.r, v=view();
  if (!v.psy){
    return `${topBar()}
    <div class="main">
      <div class="dialwrap">${dialSVG({hideNeedle:true})}${endsHTML(r.card)}</div>
      ${waitHTML(r.kind==="me" ? `${esc(psyLabel())} is placing themselves on the dial…` : `${esc(psyLabel())} is thinking of a clue…`)}

  }
  const swapBtn = r.swaps>0 ? `<button class="link" data-act="swap">Swap card (${r.swaps} left)</button>` : "";
  const passTo = g.mode==="duel" || (g.online && r.guessers.length===1) ? guesserLabel() : "guessers";
  if (r.kind==="me"){
    return `${topBar()}
    <div class="main">
      <p class="me-q">Where are you, honestly?</p>
      <p class="hint" style="text-align:center">Drag to place yourself. Your partner has to guess the spot.</p>
      <div class="dialwrap" id="dw">${dialSVG({target:r.set?r.target:null, open:true, noanim:true, hideNeedle:true, interactive:true})}${endsHTML(r.card)}</div>
    </div>

  }
  const tw = r.twist ? `<div class="twist"><div class="e">${r.twist.e}</div><div><b>${esc(r.twist.t)}</b><span>${esc(r.twist.d)}</span></div></div>` : "";
  return `${topBar()}
  <div class="main">
    <p class="hint" style="text-align:center">Only you can see this. Think of a clue that lands on the pink bullseye.</p>
    <div class="dialwrap">${dialSVG({target:r.target, open:true, noanim:true, hideNeedle:true})}${endsHTML(r.card)}</div>
    ${tw}
    <input class="field" id="clue" maxlength="40" placeholder="${g.online?"Type your clue":"Type your clue (optional)"}" value="${esc(S.draft)}" autocomplete="off" enterkeyhint="done">
  </div>
  <div class="foot"><button class="btn" data-act="hide">${g.online?"Send clue":"Hide it & pass to "+esc(passTo)}</button>${swapBtn}</div>`;

screens.guess = () => {
  const g=S.game, r=g.r, v=view();
  const me = r.kind==="me";
  const head = me ? `<div><div class="clue-sub">Where is ${esc(psyLabel())}?</div><div class="me-q" style="margin-top:4px">${esc(r.card[0])} ↔ ${esc(r.card[1])}</div></div>`
    : (r.clue?`<div><div class="clue-sub">The clue is</div><div class="clue">${esc(r.clue)}</div></div>`:`<div class="clue-sub">Listen to your psychic's clue</div>`);
  const timer = r.timeLimit ? `<div class="timer"><div class="track"><div class="fill" id="tfill" style="width:100%"></div></div><div class="t" id="tnum">${r.timeLimit}</div></div>` : "";

  return `${topBar()}
  <div class="main">
    ${head}
    ${r.twist?`<div style="text-align:center"><span class="tag">${r.twist.e} ${esc(r.twist.t)}</span></div>`:""}
    ${timer}
    <div class="dialwrap" id="dw">${dialSVG({needle:r.dial, interactive:canDrag, target:showTarget?r.target:null, open:showTarget, noanim:true})}${endsHTML(r.card)}</div>

      <p class="hint" style="text-align:center">${esc(guesserLabel())}: drag the needle to where you think it is.</p>`
      : `<p class="hint" style="text-align:center">${showTarget?"Poker face! ":""}${esc(guesserLabel())} ${g.online&&r.guessers.length===1?"is":"are"} turning the dial…</p>`}
  </div>

screens.lr = () => {
  const g=S.game, r=g.r, v=view();
  return `${topBar()}
  <div class="main">
    <div class="handoff" style="--c:${otherTeam().color};padding:20px">
      <h2 class="big" style="font-size:32px">${esc(otherTeam().name)}, your call</h2>
      <p>Is the target left or right of their needle? Get it right for 1 point.</p></div>
    <div class="dialwrap">${dialSVG({needle:r.dial})}${endsHTML(r.card)}</div>
    ${v.lr?`<div class="lr">
      <button class="L" data-act="lr" data-v="left">◀ Left<span>more ${esc(r.card[0])}</span></button>
      <button class="R" data-act="lr" data-v="right">Right ▶<span>more ${esc(r.card[1])}</span></button></div>`
      : waitHTML(`Waiting for ${esc(otherTeam().name)} to call it…`)}
  </div>`;
};

const VERDICT = {4:"Bullseye! Pure telepathy.",3:"So close. Nice read.",2:"On the board.",0:"Missed it. Totally off the wave."};
const VERDICT_ME = {4:"You know them so well!",3:"Pretty close!",2:"Warm-ish.",0:"Plot twist! Didn't see that coming."};
screens.reveal = () => {
  const g=S.game, r=g.r, s=g.lastSummary;
  let lrLine="";
  if (g.mode==="teams" && r.lr){
    const on = g.teams[1-r.team].name;
    lrLine = s.pts===4 ? `${esc(on)} can't score on a bullseye.` : (s.lrPoint? `${esc(on)} called ${r.lr} correctly: +1` : `${esc(on)} called ${r.lr}. No point.`);
  }
  const extra = [];
  if (r.twist && r.twist.fx==="double" && s.pts) extra.push("Double points!");
  if (s.bonusCard) extra.push("Bonus card earned!");
  if (s.again && !s.over) extra.push("Bullseye while behind: go again!");
  const col = {4:"var(--pink)",3:"var(--mint)",2:"var(--sun)",0:"var(--muted)"}[s.pts];
  const who = g.mode==="duel" ? `<div class="lrres fade">Points to ${esc(g.teams[r.team].name)}</div>` : "";
  return `${topBar()}
  <div class="main">
    ${r.kind!=="me" && r.clue?`<div class="clue" style="font-size:28px">“${esc(r.clue)}”</div>`:""}
    <div class="dialwrap">${dialSVG({target:r.target, needle:r.dial})}${endsHTML(r.card)}</div>
    <div class="result">
      <div class="pts" id="pts" style="color:${col}">+${s.gained}</div>
      <div class="verdict fade">${(r.kind==="me"?VERDICT_ME:VERDICT)[s.pts]}</div>
      ${who}${lrLine?`<div class="lrres fade">${lrLine}</div>`:""}
      ${extra.length?`<div class="tag fade" style="color:var(--ink)">${extra.join(" · ")}</div>`:""}
      ${r.kind==="me"?`<div class="talk fade">💬 ${esc(psyLabel())}, tell them why you picked that spot.</div>`:""}
    </div>
  </div>
  <div class="foot"><button class="btn fade" data-act="next">${s.over?"See results":"Next round"}</button></div>`;
};

function coopRank(t){ return t>=25?["Telepathic","🧠"]: t>=19?["Crystal clear","💎"]: t>=13?["Good reception","📡"]: t>=7?["Faint signal","📻"]:["Static","🌫️"]; }
screens.over = () => {
  const g=S.game, v=view();
  let head, body, c;
  if (g.mode==="coop"){ const [rk,e]=coopRank(g.coop.total); c="var(--mint)";
    head=`<div class="eye">${e}</div><h2 class="big">${rk}</h2>`; body=`<p>You scored ${g.coop.total} points together.</p>`;
  } else { const w=g.teams[g.winner]; c=w.color;
    head=`<div class="eye">🏆</div><h2 class="big">${esc(w.name)} wins!</h2>`;
    body=`<p>${g.teams.map(t=>esc(t.name)+" "+t.score).join(" · ")}</p>`; }
  const btns = g.online
    ? (v.host ? `<button class="btn" data-act="backToLobby">Play again</button>` : waitHTML("Waiting for the host")) + `<button class="btn alt" data-act="leave">Leave room</button>`
    : `<button class="btn" data-act="again">Play again</button><button class="btn alt" data-act="quit">Home</button>`;
  return `${topBar()}
  <div class="main"><div class="handoff" style="--c:${c};text-align:center;align-items:center">${head}${body}</div></div>
  <div class="foot">${btns}</div>`;
};

    <button class="btn alt" data-act="theme">Switch light/dark</button>

    const my = S.custom.find(p=>p.id==="mine");

      <button class="btn pink" data-act="gen" id="genBtn">Generate cards</button><div id="genMsg"></div></div>`:""}
    <div class="sect"><label>Write your own</label>
      <div class="row"><input class="field" id="cl" maxlength="28" placeholder="Left end"><input class="field" id="cr" maxlength="28" placeholder="Right end"></div>

/* ================= Render ================= */
let lastKey="", uiTimer=null;
function currentScreen(){
  if (S.game && S.game.phase) return S.game.phase;
  if (S.net && S.lobby) return "lobby";
  return S.screen;
}
function renderKey(){
  const g=S.game, sc=currentScreen();
  let k = sc+"|"+S.modal+"|"+S.prefs.muted+"|"+(document.documentElement.dataset.theme||"");
  if (sc==="lobby") k += JSON.stringify(S.lobby);
  if (g){ const r=g.r; k += "|"+g.round+"|"+g.phase+"|"+JSON.stringify(g.teams.map(t=>[t.score,t.members]))+"|"+(r&&[r.card[0],r.swaps,r.set,r.set?r.target:0,r.clue,r.lr,r.psychic].join("~")); }
  return k;
}
function render(force){
  if (S.dragging) return;
  const key = renderKey();
  if (!force && key===lastKey){ softUpdate(); return; }
  lastKey = key;
  const sc = currentScreen();
  $("#app").innerHTML = (screens[sc]||screens.home)() + modalHTML();
  after(sc);
}
function softUpdate(){
  const g=S.game; if(!g||g.phase!=="guess") return;
  const n=document.querySelector("#dw .needle"); if(n) n.setAttribute("transform",`rotate(${(g.r.dial-90).toFixed(2)} ${CX} ${CY})`);
}
function after(sc){
  clearInterval(uiTimer); uiTimer=null;
  if (sc==="guess"){ bindDial("guess"); startUiTimer(); }
  if (sc==="clue" && S.game.r.kind==="me" && view().psy) bindDial("set");
  if (sc==="reveal") runReveal();
  if (sc==="setup"){
    [["n0","names",0],["n1","names",1],["p0","pnames",0],["p1","pnames",1]].forEach(([id,k,i])=>{ const el=$("#"+id); if(el) el.oninput=()=>{ S.prefs[k][i]=el.value; savePrefs(); }; });
  }
  if (sc==="clue"){ const el=$("#clue"); if(el) el.oninput=()=>{ S.draft=el.value; }; }
  if (sc==="online"){
    const n=$("#myname"); if(n) n.oninput=()=>{ S.prefs.myName=n.value; savePrefs(); };
    const c=$("#code"); if(c) c.oninput=()=>{ c.value=c.value.toUpperCase().replace(/[^A-Z]/g,""); S.joinCode=c.value; };
  }
}
function go(screen){ S.screen=screen; S.modal=null; render(true); window.scrollTo(0,0); }

function startUiTimer(){
  const r=S.game.r; if(!r.timeLimit || !r.timerEnd) return;
  let warned=-1;
  const tick=()=>{
    const g=S.game; if(!g||g.phase!=="guess"){ clearInterval(uiTimer); return; }
    const now = Date.now() + (authority()?0:S.offset);
    const left = Math.max(0, Math.ceil((g.r.timerEnd - now)/1000));
    const f=$("#tfill"), n=$("#tnum");
    if(f){ f.style.width=(left/g.r.timeLimit*100)+"%"; if(left<=10) f.style.background="var(--pink)"; }
    if(n) n.textContent=left;
    if(left<=5 && left>0 && warned!==left){ warned=left; tone(880,.06,"square",.05); }
    if(left<=0){ clearInterval(uiTimer); uiTimer=null; sfx.buzz(); buzzPhone(200);
      if(authority()){ toast("Time's up!"); S.dragging=false; dispatch("lock",{auto:true}); } }
  };
  tick(); uiTimer=setInterval(tick, 250);
}
function runReveal(){
  const svg=$("svg.dial"), s=S.game.lastSummary;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ svg && svg.classList.add("open"); sfx.whoosh(); }));
  setTimeout(()=>{ $("#pts") && $("#pts").classList.add("pop"); document.querySelectorAll(".fade").forEach(e=>e.classList.add("show"));
    sfx.score(s.pts); buzzPhone(s.pts===4?[40,60,40,60,120]:40); if(s.pts===4) confetti(); }, 1050);
}

/* ================= Dial dragging ================= */
function bindDial(mode){
  const svg=$("#dw svg"); if(!svg) return;
  const g=S.game;
  const needle=svg.querySelector(".needle"), bands=svg.querySelector(".bands");
  let lastTick=-1, lastSend=0;
  const send=(final)=>{
    if(mode==="guess"){
      if(!g.online) return;
      const now=Date.now(); if(!final && now-lastSend<100) return; lastSend=now;
      dispatch("dial",{v:g.r.dial},{quiet:true});
    }
  };
  const setV=(v, final)=>{
    v=Math.max(0,Math.min(180,v));
    if(mode==="guess"){ g.r.dial=v; needle && needle.setAttribute("transform",`rotate(${(v-90).toFixed(2)} ${CX} ${CY})`); }
    else { g.r.target=v; bands.innerHTML=bandsSVG(v); }
    const k=Math.round(v/6); if(k!==lastTick){ lastTick=k; sfx.tick(); }
    send(final);
  };
  const fromEvent=e=>{ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(svg.getScreenCTM().inverse());
    const dx=q.x-CX, dy=CY-q.y; let th=Math.atan2(dy,dx)*180/Math.PI; if(dy<0) th = dx<0?180:0; return 180-th; };
  svg.addEventListener("pointerdown",e=>{ S.dragging=true; try{svg.setPointerCapture(e.pointerId);}catch(_){} setV(fromEvent(e)); e.preventDefault(); });
  svg.addEventListener("pointermove",e=>{ if(S.dragging) setV(fromEvent(e)); });
  const end=()=>{ if(!S.dragging) return; S.dragging=false;
    if(mode==="guess"){ send(true); }
    else { dispatch("setTarget",{v:g.r.target}); }
    if(!authority()) render(false);
  };
  svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end);
  S._nudge = d => { if(mode!=="guess") return; setV(g.r.dial+d, true); };
}

/* ================= Networking (Supabase Realtime) =================
   Every phone joins a Realtime channel named after the room code.
   - presence: who is in the room (host + guests), cleared automatically when a phone leaves
   - broadcast "state": the host sends the whole game state (host is the single source of truth)
   - broadcast "act":   guests send their moves to the host
   - broadcast "dial":  lightweight needle updates while someone drags, to save messages */
const CFG = window.TUNEDIN_CONFIG || {};
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const clone = o => (typeof structuredClone==="function") ? structuredClone(o) : JSON.parse(JSON.stringify(o));
let _sb = null;
function sbClient(){
  if (!_sb && window.supabase && CFG.supabaseUrl && CFG.supabaseKey){
    _sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {
      auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false},
      realtime:{params:{eventsPerSecond:20}}
    });
  }
  return _sb;
}
function newCode(){ let c=""; for(let i=0;i<4;i++) c+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]; return c; }
function myName(){ return clean(S.prefs.myName).trim().slice(0,16) || "Player"; }
function setStatus(msg){ S.netMsg=msg; S.netBad=false; const el=$(".status"); if(el){ el.textContent=msg; el.classList.remove("bad"); } }
function netFail(msg){ S.busy=false; S.netMsg=msg; S.netBad=true; teardown(); render(true); }
function teardown(){
  const n=S.net; S.net=null; if(!n) return;
  clearInterval(n.helloTimer);
  try{ n.ch && sbClient().removeChannel(n.ch); }catch(e){}
}
function presencePeople(ch){
  const out=[]; const st=ch.presenceState()||{};
  Object.keys(st).forEach(k=>(st[k]||[]).forEach(m=>out.push(Object.assign({key:k}, m))));
  return out;
}
/* Open a channel and resolve once subscribed + tracked (or null on failure). */
function openChannel(code, key, meta, on){
  return new Promise(res=>{
    const client=sbClient(); if(!client) return res(null);
    const ch=client.channel("tunedin:"+code, {config:{broadcast:{self:false}, presence:{key}}});
    ch.on("presence",{event:"sync"}, ()=>on.sync && on.sync());
    ["state","act","hello","dial"].forEach(ev=> ch.on("broadcast",{event:ev}, m=>on[ev] && on[ev](m.payload||{})));
    let settled=false;
    const finish=v=>{ if(settled) return; settled=true; clearTimeout(to); if(!v){ try{client.removeChannel(ch);}catch(e){} } res(v); };
    const to=setTimeout(()=>finish(null), 10000);
    ch.subscribe(async status=>{
      if(status==="SUBSCRIBED"){
        try{ await ch.track(meta); }catch(e){}
        if(!settled) finish(ch); else on.resubscribed && on.resubscribed();
      } else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){
        if(!settled) finish(null);
      }
    });
  });
}
function send(ev, payload){
  const n=S.net; if(!n||!n.ch) return;
  n.ch.send({type:"broadcast", event:ev, payload}).catch(()=>{});
}

/* ---------- hosting ---------- */
async function hostRoom(){
  if(!(S.prefs.myName||"").trim()){ S.netMsg="Add your name first."; S.netBad=true; return render(true); }
  if(S.busy) return;
  S.busy="host"; S.netMsg=""; render(true);
  if(!sbClient()) return netFail("Online play isn't available right now.");
  for(let i=0;i<4;i++){
    const code=newCode();
    const net={role:"host", code, ch:null, present:new Set(), seen:new Map()};
    const ch = await openChannel(code, "h-"+CID, {role:"host", cid:CID, name:myName()}, {
      sync:()=>hostSync(net), hello:p=>{ if(S.net===net){ hostHello(clean(p.cid).slice(0,20), p.name, true); } },
      act:p=>{ if(S.net===net){ const id=clean(p.cid).slice(0,20); if(id) hostAct(id, {a:String(p.a||""), p:(p.p&&typeof p.p==="object")?p.p:{}}); } },
      resubscribed:()=>{ if(S.net===net) broadcast(); }
    });
    if(!ch) return netFail("Couldn't reach the game server. Check your internet and try again.");
    net.ch=ch;
    await sleep(900);
    if(presencePeople(ch).some(p=>p.role==="host" && p.cid!==CID)){ try{ sbClient().removeChannel(ch); }catch(e){} continue; }
    S.net=net;
    S.lobby={code, hostId:CID, players:[{id:CID,name:myName(),team:0,online:true}],
      settings:{mode:"duel", packs:S.prefs.packs.slice(), twists:S.prefs.twists, timer:S.prefs.timer, goal:10}};
    S.busy=false; S.netMsg=""; sfx.join(); hostSync(net); broadcast(); render(true);
    return;
  }
  netFail("Couldn't create a room. Try again.");
}
function hostSync(net){
  if(S.net!==net || !S.lobby) return;
  const now=new Map();
  presencePeople(net.ch).forEach(p=>{ if(p.role==="guest" && p.cid) now.set(clean(p.cid).slice(0,20), p.name); });
  now.forEach((name,id)=>{ if(!net.present.has(id)) hostHello(id, name, false); });
  net.present.forEach(id=>{ if(!now.has(id)) guestGone(id); });
  net.present=new Set(now.keys());
}
function teamForNew(){
  const L=S.lobby, c0=L.players.filter(p=>p.team===0).length, c1=L.players.filter(p=>p.team===1).length;
  return c0<=c1?0:1;
}
function autoMode(){
  const L=S.lobby, n=L.players.length, st=L.settings;
  if (n<=2 && st.mode==="teams") st.mode="duel";
  if (n>=3 && st.mode==="duel") st.mode="teams";
}
function hostHello(id, rawName, always){
  const L=S.lobby, g=S.game; if(!L||!id) return;
  const name=clean(rawName).trim().slice(0,16)||"Player";
  let p=L.players.find(p=>p.id===id);
  if(p){ if(p.online && p.name===name){ if(always) broadcast(); return; } p.online=true; p.name=name; }
  else {
    if(L.players.length>=12) return;
    p={id,name,team:teamForNew(),online:true}; L.players.push(p);
    if(g){ // late join
      g.players.push({id,name});
      if(g.mode==="coop") g.teams[0].members.push(id);
      else if(g.mode==="teams") g.teams[p.team].members.push(id);
    } else autoMode();
    sfx.join(); toast(name+" joined");
  }
  broadcast(); render(false);
}
function hostAct(from, msg){
  const L=S.lobby, g=S.game, p=msg.p||{};
  if (!L) return;
  if (!g){
    if (msg.a==="swapTeam" && L.settings.mode==="teams"){ const pl=L.players.find(x=>x.id===from); if(pl){ pl.team=1-pl.team; broadcast(); render(false);} }
    return;
  }
  if (reduce(msg.a, p, from)){ if(msg.a==="dial") broadcastDial(); else broadcast(); render(false); }
}
function guestGone(id){
  const p=S.lobby && S.lobby.players.find(p=>p.id===id); if(!p || !p.online) return;
  p.online=false; toast(p.name+" disconnected");
  broadcast(); render(false);
}
function broadcast(){
  const n=S.net; if(!n||n.role!=="host") return;
  send("state", {lobby:S.lobby, game:S.game?strip(S.game):null, hostTime:Date.now()});
}
function broadcastDial(){
  const n=S.net; if(!n||n.role!=="host"||!S.game||!S.game.r) return;
  send("dial", {round:S.game.round, v:S.game.r.dial});
}
function strip(g){ const c=Object.assign({}, g); c.deck=[]; return c; }

/* ---------- joining ---------- */
async function joinRoom(){
  const code=(S.joinCode||"").toUpperCase();
  if(!(S.prefs.myName||"").trim()){ S.netMsg="Add your name first."; S.netBad=true; return render(true); }
  if(code.length!==4){ S.netMsg="Room codes are 4 letters."; S.netBad=true; return render(true); }
  if(S.busy) return;
  S.busy="join"; S.netMsg=""; render(true);
  if(!sbClient()) return netFail("Online play isn't available right now.");
  const sid=Math.random().toString(36).slice(2,8);
  const net={role:"guest", code, ch:null, joined:false, hostGoneAt:0, helloTimer:null};
  S.net=net;
  const ch = await openChannel(code, "g-"+CID+"-"+sid, {role:"guest", cid:CID, name:myName()}, {
    state:p=>{ if(S.net===net) guestState(p); },
    dial:p=>{ if(S.net===net && S.game && S.game.r && S.game.round===p.round && S.game.phase==="guess" && !S.dragging){ S.game.r.dial=Math.max(0,Math.min(180,+p.v||0)); softUpdate(); } },
    sync:()=>guestSync(net),
    resubscribed:()=>{ if(S.net===net) send("hello",{cid:CID, name:myName()}); }
  });
  if(S.net!==net){ if(ch) try{ sbClient().removeChannel(ch); }catch(e){} return; }
  if(!ch) return netFail("Couldn't reach the game server. Check your internet and try again.");
  net.ch=ch;
  setStatus("Looking for room "+code+"…");
  send("hello",{cid:CID, name:myName()});
  net.helloTimer=setInterval(()=>{ if(S.net!==net||net.joined){ clearInterval(net.helloTimer); return; } send("hello",{cid:CID, name:myName()}); }, 1500);
  setTimeout(()=>{ if(S.net===net && !net.joined) netFail("No room with that code. Check it and try again."); }, 8000);
}
function guestSync(net){
  if(S.net!==net || !net.ch || !net.joined) return;
  const hostHere = presencePeople(net.ch).some(p=>p.role==="host");
  if(hostHere){ net.hostGoneAt=0; return; }
  if(!net.hostGoneAt){
    net.hostGoneAt=Date.now();
    setTimeout(()=>{ if(S.net===net && net.hostGoneAt && !presencePeople(net.ch).some(p=>p.role==="host")) hostLeft("The host left or lost connection."); }, 8000);
  }
}
function guestState(msg){
  if(!msg||!msg.lobby||!S.net) return;
  if(!S.net.joined){ S.net.joined=true; clearInterval(S.net.helloTimer); S.busy=false; S.netMsg=""; sfx.join(); }
  S.offset = (+msg.hostTime||Date.now()) - Date.now();
  S.lobby=clone(msg.lobby); S.game=msg.game?clone(msg.game):null;
  render(false);
}
function hostLeft(msg){
  S.netMsg=msg; teardown(); S.game=null; S.lobby=null; S.busy=false; S.modal="left"; S.screen="home"; render(true);
}
function netSend(m){
  const n=S.net; if(!n) return;
  send("act", {cid:CID, a:String(m.a), p:m.p||{}});
}
function leaveRoom(){
  teardown(); S.game=null; S.lobby=null; S.modal=null; S.screen="home"; render(true);
}
function inviteLink(){ return CFG.shareUrl ? CFG.shareUrl.replace(/\/$/,"")+"/?room="+encodeURIComponent(S.lobby.code) : ""; }

/* ================= AI pack (claude.ai only) ================= */
async function initSample(){
  try{ if(window.claude && typeof window.claude.use==="function"){ const s=await window.claude.use("sample"); if(s){ S.sample=s; if(S.modal==="packs") render(true); } } }catch(e){}
}
async function generatePack(){
  const inp=$("#theme"), btn=$("#genBtn"), msg=$("#genMsg");
  const theme=(inp&&inp.value||"").trim();
  if(!theme){ msg.innerHTML=`<p class="err">Type a theme first.</p>`; return; }
  btn.disabled=true; btn.innerHTML=`<span class="spin"></span> Writing cards…`; msg.innerHTML="";
  const prompt=`You write spectrum cards for a party guessing game. A card is two OPPOSITE ends of a spectrum, e.g. ["Underrated","Overrated"], where many things can sit in between.
Theme: "${theme.replace(/"/g,"'")}"
Write 14 fun, varied cards that fit this theme. Each end is 1-4 words. Avoid anything hateful or explicit.
Respond with only JSON: {"emoji":"one emoji","cards":[["left end","right end"]]}`;
  try{
    const out = await S.sample.json(prompt, {modelTier:"quick"});
    const cards=(out&&Array.isArray(out.cards)?out.cards:[]).filter(c=>Array.isArray(c)&&c[0]&&c[1]).map(c=>[String(c[0]).slice(0,32),String(c[1]).slice(0,32)]);
    if(cards.length<4) throw {code:"bad"};
    const id="ai-"+Date.now().toString(36), cols=["#FF4F8B","#22E5A5","#FFC53D","#46C2FF","#8F6BFF","#FF7A45"];
    S.custom.push({id,name:theme.slice(0,24),e:(out.emoji&&String(out.emoji).slice(0,4))||"✨",c:cols[S.custom.length%cols.length],cards});
    store.set("custom",S.custom); if(!S.prefs.packs.includes(id)) S.prefs.packs.push(id); savePrefs();
    confetti(40); toast(`Added “${theme.slice(0,24)}”`); render(true);
  }catch(e){
    const m = e&&e.code==="not_granted" ? "Generating needs your permission. You can still write cards by hand below."
            : e&&e.code==="rate_limited" ? "Too many requests. Try again in a minute." : "Couldn't make cards for that theme. Try rewording it.";
    btn.disabled=false; btn.textContent="Generate cards"; msg.innerHTML=`<p class="err">${m}</p>`;
  }
}

function lobbyEdit(fn){ if(!view().host||!S.lobby) return; fn(S.lobby.settings); broadcast(); render(true); }
const actions = {
  help(){ S.modal="help"; render(true); }, menu(){ S.modal="menu"; render(true); }, packs(){ S.modal="packs"; render(true); },
  close(){ S.modal=null; render(true); },

    r.dataset.theme = dark?"light":"dark"; store.set("theme", r.dataset.theme); S.modal=null; render(true); },
  home(){ S.netMsg=""; go("home"); }, setup(){ go("setup"); },

    broadcast(); render(true); },
  backToLobby(){ if(!view().host) return; S.game=null; autoMode(); broadcast(); render(true); },
  gen(){ generatePack(); },
  addCard(){ const l=($("#cl").value||"").trim(), r=($("#cr").value||"").trim();
    if(!l||!r){ toast("Fill in both ends"); return; }
    let my=S.custom.find(p=>p.id==="mine"); if(!my){ my={id:"mine",name:"My cards",e:"✏️",c:"#22E5A5",cards:[]}; S.custom.push(my); }
    my.cards.push([l.slice(0,28),r.slice(0,28)]); store.set("custom",S.custom);
    if(!S.prefs.packs.includes("mine")) { S.prefs.packs.push("mine"); savePrefs(); }
    toast("Card added"); render(true); setTimeout(()=>$("#cl")&&$("#cl").focus(),0); },
  delPack(el){ const id=el.dataset.id; S.custom=S.custom.filter(p=>p.id!==id); store.set("custom",S.custom);
    S.prefs.packs=S.prefs.packs.filter(x=>x!==id); savePrefs(); render(true); }
};
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a==="backdrop"){ if(e.target===el){ S.modal=null; render(true); } return; }
  if(!actions[a]) return;
  sfx.tap(); actions[a](el, e);
});
document.addEventListener("keydown", e=>{
  const tag=document.activeElement && document.activeElement.tagName;
  if(S.game && S.game.phase==="guess" && !S.modal && tag!=="INPUT"){
    if(e.key==="ArrowLeft"){ S._nudge&&S._nudge(-2); e.preventDefault(); }
    if(e.key==="ArrowRight"){ S._nudge&&S._nudge(2); e.preventDefault(); }
  }
  if(e.key==="Enter" && document.activeElement){
    const id=document.activeElement.id;
    if(id==="clue") document.activeElement.blur();
    if(id==="code") joinRoom();
  }
  if(e.key==="Escape" && S.modal){ S.modal=null; render(true); }
});

/* ================= Boot ================= */
const th=store.get("theme",null); if(th) document.documentElement.dataset.theme=th;
render(true);
initSample();
window.TunedIn = {scoreFor, applyRound, buildDeck, makeGame, PACKS, TWISTS, BAND, S, CID};
})();

</script>
